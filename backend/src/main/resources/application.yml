server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: "configmanager"
  datasource:
    # Параметры подключения переопределяются переменными окружения
    # (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD); значения по умолчанию —
    # для локальной разработки.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:igor}
    password: ${DB_PASSWORD:8008}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

management:
  endpoints:
    web:
      base-path: /api/actuator   # под /api, чтобы проходило через vite-прокси
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    # Отключаем штатный LDAP-индикатор: он лезет на dc.company.local даже при
    # выключенном AD и роняет health. Вместо него — DomainHealthIndicator ("domain").
    ldap:
      enabled: false

network-scan:
  redis-key-prefix: network-scan
  result-ttl: PT5M
  max-hosts: 256
  thread-pool-size: 20
  ping-timeout: 2000
  ping-enabled: true
  port-scan-timeout: 1000
  ssh-connect-timeout: 5000
  winrm-connect-timeout: 8000

logging:
  level:
    com.example.configmanager: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE
    # Подробные логи сканирования сети (доступность, опрос, добавление устройств)
    com.uniikm.configmanager.device.service.NetworkScannerService: DEBUG
    com.uniikm.configmanager.integration.service.NetworkProbeService: DEBUG
    # Передача данных в WebSocket-терминале: DEBUG — направление/размер,
    # TRACE — содержимое (нажатия/вывод). Поставь TRACE, чтобы видеть данные.
    com.uniikm.configmanager.device.websocket.TerminalWebSocketHandler: DEBUG

remote-command:
  redis-key-prefix: remote-command
  result-ttl: PT24H
  default-timeout: PT60S
  max-targets: 50

ssh:
  proxy:
    enabled: true

winrm:
  executable: pwsh
