server:
  port: 8080

spring:
  application:
    name: "configmanager"
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    driver-class-name: org.postgresql.Driver
    username: igor
    password: 8008
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

network-scan:
  redis-key-prefix: network-scan
  result-ttl: PT5M 
  max-hosts: 256
  thread-pool-size: 20

logging:
  level:
    com.example.configmanager: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE

remote-command:
  redis-key-prefix: remote-command
  result-ttl: PT24H
  default-timeout: PT60S
  max-targets: 50

ssh:
  proxy:
    enabled: true

winrm:
  executable: pwsh
