# Зависимости бэкенда для тестового прогона: PostgreSQL и Redis.
# Параметры совпадают с backend/src/main/resources/application.yml.
#
#   docker compose -f clab/deps/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: cfgmgr-postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: igor
      POSTGRES_PASSWORD: "8008"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igor -d mydatabase"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: cfgmgr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
