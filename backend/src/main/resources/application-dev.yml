# Профиль локальной разработки (активен по умолчанию: SPRING_PROFILES_ACTIVE=dev).
# Содержит удобные дефолты для локальной БД и подробное логирование.
# НЕ использовать в продакшене — там профиль prod (все секреты из окружения).
spring:
  datasource:
    # Локальная БД для разработки. Можно переопределить переменными окружения.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USER:igor}
    password: ${DB_PASSWORD:8008}
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE
    # Подробные логи сканирования сети (доступность, опрос, добавление устройств)
    com.uniikm.configmanager.device.service.NetworkScannerService: DEBUG
    com.uniikm.configmanager.integration.service.NetworkProbeService: DEBUG
    # Передача данных в WebSocket-терминале: DEBUG — направление/размер,
    # TRACE — содержимое (нажатия/вывод). Поставь TRACE, чтобы видеть данные.
    com.uniikm.configmanager.device.websocket.TerminalWebSocketHandler: DEBUG
