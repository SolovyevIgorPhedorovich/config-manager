server:
  port: 8080

spring:
  application:
    name: "configmanager"
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    driver-class-name: org.postgresql.Driver
    username: igor
    password: 8008
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

management:
  endpoints:
    web:
      base-path: /api/actuator   # под /api, чтобы проходило через vite-прокси
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

network-scan:
  redis-key-prefix: network-scan
  result-ttl: PT5M
  max-hosts: 256
  thread-pool-size: 20
  ping-timeout: 2000
  ping-enabled: true
  port-scan-timeout: 1000
  ssh-connect-timeout: 5000
  winrm-connect-timeout: 8000

logging:
  level:
    com.example.configmanager: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE
    # Подробные логи сканирования сети (доступность, опрос, добавление устройств)
    com.uniikm.configmanager.device.service.NetworkScannerService: DEBUG
    com.uniikm.configmanager.integration.service.NetworkProbeService: DEBUG

remote-command:
  redis-key-prefix: remote-command
  result-ttl: PT24H
  default-timeout: PT60S
  max-targets: 50

ssh:
  proxy:
    enabled: true

winrm:
  executable: pwsh
