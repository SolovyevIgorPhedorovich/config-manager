services:
  app:
    build: ./backend
    image: config-manager:latest
    container_name: config-manager-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-config_manager}
      DB_USER: ${DB_USER:-cms_user}
      DB_PASSWORD: ${DB_PASSWORD:-cms_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: config-manager-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-config_manager}
      POSTGRES_USER: ${DB_USER:-cms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cms_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cms_user} -d ${DB_NAME:-config_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: config-manager-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
